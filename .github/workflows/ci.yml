name: CI

on:
  push:
  pull_request:

jobs:
  backend-checks:
    name: Backend Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate required environment variables format
        run: |
          node -e "const fs=require('fs'); const p='.env.example'; if(!fs.existsSync(p)) throw new Error('.env.example not found'); const lines=fs.readFileSync(p,'utf8').split(/\r?\n/).filter(Boolean).filter(l=>!l.trim().startsWith('#')); if(lines.length===0) throw new Error('.env.example is empty'); const bad=lines.filter(l=>!l.includes('=')); if(bad.length) throw new Error('Invalid env example lines: '+bad.join(', '));"

      - name: Verify backend app loads
        run: node -e "require('./app'); console.log('backend app loaded')"

      - name: Smoke test health endpoint
        run: |
          node server.js > /tmp/cybershield-backend.log 2>&1 &
          BACK_PID=$!
          sleep 2
          node -e "const http=require('http');http.get('http://127.0.0.1:5000/health',res=>{if(res.statusCode!==200){console.error('Health check failed with status',res.statusCode);process.exit(1);}process.exit(0);}).on('error',err=>{console.error(err.message);process.exit(1);});"
          kill $BACK_PID

  frontend-checks:
    name: Frontend Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify env example presence
        run: test -f .env.example

      - name: Build frontend
        run: npm run build
